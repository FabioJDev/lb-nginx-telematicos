<header>Servicios Telemáticos 2026-02 · Proyecto 2 · Grupo 3</header>
<h2 id="problema-objetivo-y-conceptos-del-curso">Problema, objetivo y conceptos del curso</h2>
<div class="c64">
<div>
<p><strong>Problema.</strong> Un solo servidor web es un <strong>punto único de falla</strong> (si cae, el servicio cae) y un <strong>techo de capacidad</strong> (si la demanda lo supera, la latencia crece hasta fallar).</p>
<p><strong>Solución.</strong> Un <strong>balanceador de capa 7</strong> (proxy inverso) que reparte las peticiones entre N backends equivalentes: escalado horizontal y tolerancia a fallos.</p>
<p><strong>Objetivo.</strong> Diseñar, implementar y evaluar un clúster web con NGINX, <strong>todo en Docker Compose</strong>, comparando algoritmos y midiendo desempeño y resiliencia con Artillery.</p>
</div>
<div>
<table>
<thead>
<tr>
<th>Concepto</th>
<th>Dónde se ve</th>
</tr>
</thead>
<tbody>
<tr>
<td>Sin vs con balanceo</td>
<td>E-02: 1 a 7 réplicas</td>
</tr>
<tr>
<td>Capa 4 vs capa 7</td>
<td>hash por cabecera, solo en L7</td>
</tr>
<tr>
<td>Proxy inverso</td>
<td>backends sin puertos al host</td>
</tr>
<tr>
<td>RR, leastconn, source</td>
<td>3 del enunciado + 4 más</td>
</tr>
<tr>
<td>Alta disponibilidad</td>
<td>reintentos, keepalived</td>
</tr>
<tr>
<td>Pruebas de carga</td>
<td>rampa, 1000 usuarios, quiebre</td>
</tr>
</tbody>
</table>
</div>
</div>
<footer>Balanceador de carga web con NGINX</footer>
</section>

<header>Servicios Telemáticos 2026-02 · Proyecto 2 · Grupo 3</header>
<h2 id="reflexi%C3%B3n-de-la-matriz-y-descubrimiento-de-backends">Reflexión de la matriz y descubrimiento de backends</h2>
<div class="cols">
<div>
<p><strong>Matriz 4.1</strong></p>
<ul>
<li><strong>No elige NGINX: HAProxy gana por 13 puntos</strong> (checks activos y pasivos, más algoritmos y métricas por servidor). Estable con ±5 en cualquier peso.</li>
<li>NGINX y HAProxy <strong>empatan en desempeño</strong>; al medir, la ventaja de HAProxy creció de 3 a 13.</li>
<li>NGINX es <strong>requisito del cliente</strong>: la matriz valida la elección y expone su costo. Sus debilidades se mitigan en el diseño (reintentos, exporter + logs, <code>resolve</code>).</li>
<li>Sin esa restricción, recomendaríamos HAProxy.</li>
</ul>
</div>
<div>
<p><strong>Matriz 4.3: descubrimiento</strong></p>
<table>
<thead>
<tr>
<th>Alternativa</th>
<th>Puntaje</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>DNS con <code>resolve</code></strong> (elegida)</td>
<td><strong>78</strong></td>
</tr>
<tr>
<td>Regenerar config + reload</td>
<td>58</td>
</tr>
<tr>
<td>Servidores estáticos</td>
<td>56</td>
</tr>
</tbody>
</table>
<p>Docker resuelve <code>backend</code> a todas las réplicas y NGINX lo re-resuelve cada 5 s: <strong>escalar sin recargar</strong>. Tras H-1, conviene regenerar solo si la afinidad estable pesara ≥ 20/100.</p>
</div>
</div>

<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-nginx"><span class="hljs-section">upstream</span> backend_pool {
  <span class="hljs-attribute">zone</span> backend_pool <span class="hljs-number">128k</span>;
  <span class="hljs-attribute">include</span> policies/<span class="hljs-variable">${LB_POLICY}</span>.conf;
  <span class="hljs-attribute">server</span> backend:<span class="hljs-number">3000</span> resolve max_fails=<span class="hljs-number">3</span> fail_timeout=<span class="hljs-number">10s</span>;
  <span class="hljs-attribute">keepalive</span> <span class="hljs-number">64</span>;
}
</code></pre>

<div class="small">
<p><strong>Dos redes con nombre:</strong> solo el LB publica :8080; <code>lbnginx_backend</code> es <code>internal: true</code>. <strong>Configuración 100 % externa</strong> (volúmenes <code>:ro</code> + <code>envsubst</code>).</p>

<h2 id="m-05-y-e-03-%C2%BFcu%C3%A1ndo-importa-el-algoritmo">M-05 y E-03: ¿cuándo importa el algoritmo?</h2>
<div class="cols">
<div>
<p><strong>M-05: backends iguales</strong> (<code>rampa.yml</code>)</p>
<table>
<thead>
<tr>
<th>Política</th>
<th>Media</th>
<th>p99</th>
</tr>
</thead>
<tbody>
<tr>
<td>round_robin</td>
<td>20,30 ms</td>
<td>22 ms</td>
</tr>
<tr>
<td>least_conn</td>
<td>20,35 ms</td>
<td>22 ms</td>
</tr>
<tr>
<td>ip_hash</td>
<td>20,33 ms</td>
<td>22 ms</td>
</tr>
</tbody>
</table>
<p><strong>No distinguibles.</strong> Pero <code>ip_hash</code> mandó todo a un backend: usa la /24.</p>
</div>
<div>

<tr>
<th>Política</th>

<th>Al lento</th>
</tr>
</thead>

<td><strong>171 ms</strong></td>
<td>25 %</td>
</tr>
<tr>
<td>RR con peso 3:1</td>
<td>171 ms</td>
<td>10 %</td>
</tr>
<tr>
<td><strong>least_conn</strong></td>

<h2 id="la-base-de-datos-compartida-el-nuevo-cuello-de-botella">La base de datos compartida: el nuevo cuello de botella</h2>
<div class="cols">
<div>
<p><strong>E-17:</strong> de 1 a 5 réplicas, la CPU por réplica baja de 21 % a 9 %, pero <strong>PostgreSQL sigue en ~23 %</strong>.</p>
<p><strong>A-02 microcaché de 1 s</strong> en NGINX (solo catálogo público):</p>
<p><img src="../docs/figuras/cache_tienda.png" alt="" style="width:540px;" /></p>
<p>61,6 % de aciertos · CPU de PostgreSQL <strong>22,6 → 5,1 % (−77 %)</strong> · latencia 1,24 → 0,28 ms</p>
</div>
<div>
<p><strong>E-18 / E-19: cae una dependencia 30 s</strong></p>
<table>
<thead>
<tr>
<th></th>
<th>Antes (H-8)</th>
<th>Corregido</th>
</tr>
</thead>
<tbody>
<tr>
<td>Réplicas sanas descartadas</td>
<td>99,9 %</td>
<td><strong>0 %</strong></td>
</tr>
<tr>
<td>Catálogo con Redis caído</td>
<td>27,8 % errores</td>
<td><strong>0 %</strong></td>
</tr>
<tr>
<td>Recuperación tras PostgreSQL</td>
<td>6,3 s</td>
<td><strong>1,3 s</strong></td>
</tr>
</tbody>
</table>
<p><strong>Causa:</strong> el 503 de la aplicación contaba como fallo en <code>proxy_next_upstream</code> y NGINX descartaba réplicas sanas. <strong>Corrección:</strong> sin <code>http_503</code>, adoptada por defecto.</p>
</div>
</div>
<footer>Balanceador de carga web con NGINX</footer>

<h2 id="hallazgos-lo-que-no-estaba-en-el-enunciado">Hallazgos: lo que no estaba en el enunciado</h2>
<div class="small">
<table>
<thead>
<tr>
<th>#</th>
<th>Hallazgo</th>
<th>Consecuencia</th>
</tr>
</thead>
<tbody>
<tr>
<td>H‑1</td>
<td><code>hash … consistent</code> + <code>resolve</code> no da afinidad en NGINX 1.30.6</td>
<td><code>hash_client</code> con hash simple; remapeo del 84 % al escalar</td>
</tr>
<tr>
<td>H‑3</td>
<td><code>resolve</code> envía tráfico antes del healthcheck de Docker</td>
<td>lo mitigan la detección pasiva y los reintentos</td>
</tr>
<tr>
<td>H‑4</td>
<td>Errores 500 y lentitud son invisibles para la detección pasiva</td>
<td>33 % de errores con un backend que responde 500</td>
</tr>
<tr>
<td>H‑5</td>
<td>Con 2 vCPU el generador de carga es el cuello de botella</td>
<td>capacidad medida con costo de CPU</td>
</tr>
<tr>
<td>H‑6</td>
<td>La afinidad no puede basarse en la cookie de la aplicación</td>
<td>el LB emite su propia cookie <code>lbid</code></td>
</tr>
<tr>
<td>H‑8</td>
<td>El 503 de una dependencia tumba réplicas sanas</td>
<td>sin <code>http_503</code>: recuperación 6,3 → 1,3 s</td>
</tr>
<tr>
<td>H‑9</td>
<td>Cambios de <code>.env</code> a mitad de un lote no llegaban a los scripts</td>
<td><code>metadata.json</code> guarda la configuración efectiva</td>
</tr>
<tr>
<td>H‑10</td>
<td>El tiempo de respuesta de Artillery no incluye la conexión</td>
<td>TLS y failover medidos con la duración de la sesión</td>
</tr>
<tr>
<td>H‑11</td>
<td>VRRP con preempción corta dos veces</td>
<td><code>nopreempt</code> por defecto</td>
</tr>
</tbody>
</table>
</div>
<footer>Balanceador de carga web con NGINX</footer>
</section>

<header>Servicios Telemáticos 2026-02 · Proyecto 2 · Grupo 3</header>
<h2 id="conclusiones">Conclusiones</h2>
<div class="cols">
<div>
<p><strong>Sobre el balanceo</strong></p>
<ul>
<li>Aporta <strong>disponibilidad</strong> (0 errores al perder un backend) y <strong>capacidad casi lineal</strong> (×4,6 con 5 réplicas).</li>
<li>Con backends iguales el algoritmo no importa; con capacidad distinta, <strong><code>least_conn</code></strong> (p95 171 → 23 ms). Es la recomendación de la matriz 4.2 (92/100).</li>
<li>Los cuelgues cuestan el timeout: <strong>3 s + reintentos</strong>.</li>
</ul>
</div>
<div>
<p><strong>Sobre un servicio real</strong></p>
<ul>
<li>Con estado importa más <strong>dónde vive la sesión</strong> que el algoritmo: Redis + <code>least_conn</code>, o <code>sticky_cookie</code> si la sesión no puede salir de la réplica.</li>
<li>La base de datos no escala con los backends; la <strong>microcaché</strong> sí la alivia.</li>
<li>El propio balanceador deja de ser punto único de falla con <strong>keepalived</strong> (3,5 s).</li>
</ul>
<p><strong>Trabajo futuro:</strong> health checks activos, HA de PostgreSQL y Redis, TLS hasta los backends, Kubernetes.</p>
</div>
</div>
<footer>Balanceador de carga web con NGINX</footer>

<h2 id="demostraci%C3%B3n-en-vivo">Demostración en vivo</h2>
<div class="cols">
<div>
<ol>
<li><strong>Despliegue:</strong> <code>make up</code> y <code>make ps</code> → backends, PostgreSQL y Redis sin puertos al host</li>
<li><strong>Reparto:</strong> <code>make smoke</code> y la página <code>/nodo</code> cambiando de nodo</li>
<li><strong>La tienda</strong> en <code>localhost:8080</code>: login, carrito y compra; el panel muestra qué réplica atiende</li>
<li><strong>Sesiones:</strong> <code>make sesiones S=memory</code> → «Sesión perdida»; <code>make policy P=sticky_cookie</code> → el carrito se conserva</li>
</ol>
</div>
<div>
<ol start="5">
<li><strong>Grafana</strong> con carga constante: distribución por réplica en vivo</li>
<li><strong>Afinidad:</strong> <code>make policy P=ip_hash</code> → todo a un backend; <code>P=hash_client</code> → se reparte</li>
<li><strong>Falla:</strong> <code>scripts/inject-fault.sh rm 1</code> → redistribución sin errores</li>
<li><strong>Escalado:</strong> <code>make scale N=5</code> → réplicas nuevas <strong>sin reiniciar NGINX</strong></li>
</ol>
