# nginx/policies/hash_client_plain.conf
# Hash NO consistente de X-Client-Id (variante de control para E-05/E-06): el
# hash se calcula sobre la lista de servidores vigente en cada petición, por lo
# que funciona con 'resolve'; al cambiar el número de backends se remapean casi
# todos los clientes (a diferencia de 'consistent').
hash $http_x_client_id;
