# nginx/policies/hash_client.conf
# Afinidad por cliente LÓGICO: hash de la cabecera X-Client-Id (decisión de capa 7,
# imposible en un balanceador L4). Requiere que el cliente envíe la cabecera.
#
# HALLAZGO (docs/hallazgos.md): se usa hash SIMPLE y no 'consistent'. En NGINX 1.30.6
# 'hash ... consistent' combinado con 'server backend:3000 resolve' no aplica el hash
# (0 % de afinidad, reparto tipo round-robin), porque el anillo de puntos se construye
# al cargar la configuración, antes de que 'resolve' aporte las IPs. El hash simple se
# calcula en cada petición sobre los peers vigentes y sí mantiene la afinidad.
# Variante con 'consistent' para reproducir el hallazgo: hash_client_consistent.conf
hash $http_x_client_id;
