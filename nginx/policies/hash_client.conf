# nginx/policies/hash_client.conf
# Hash CONSISTENTE (ketama) de la cabecera X-Client-Id: afinidad por cliente
# lógico, decisión de capa 7 imposible en un balanceador L4. Al quitar un backend
# solo se remapea ~1/N de los clientes (E-06). Requiere que el cliente envíe la cabecera.
hash $http_x_client_id consistent;
