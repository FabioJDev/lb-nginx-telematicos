# nginx/policies/sticky_cookie.conf
# Afinidad por COOKIE EMITIDA POR EL BALANCEADOR (capa 7). En la primera petición de
# un cliente se elige el nodo con hash($request_id) y NGINX responde con la cookie
# lbid=<ese $request_id>; a partir de ahí hash($cookie_lbid) devuelve SIEMPRE ese nodo.
# La clave ($lb_sticky_key) y la cookie se definen en http.conf.template.
#
# Es el equivalente libre del "sticky cookie" de NGINX Plus / HAProxy. Hacer hash de
# la cookie de sesión de la APLICACIÓN no sirve (hallazgo H-6): el login ocurre antes
# de que exista esa cookie, en un nodo distinto del que luego elige su hash.
# Hash simple, no 'consistent' (hallazgo H-1).
hash $lb_sticky_key;
