# nginx/policies/sticky_cookie.conf
# Afinidad por COOKIE de sesión (L7): hash de la cookie "sid" que crea la tienda al
# iniciar sesión. Antes del login (sin cookie) se usa $request_id, que es aleatorio,
# así que esas peticiones se reparten. La clave se calcula con un map en
# http.conf.template ($lb_sticky_key). Hash simple, no 'consistent' (hallazgo H-1).
# Es el equivalente libre del "sticky cookie" de NGINX Plus / HAProxy.
hash $lb_sticky_key;
