# nginx/policies/hash_client_consistent.conf
# Hash CONSISTENTE (ketama) de X-Client-Id. Se conserva para reproducir el hallazgo
# de docs/hallazgos.md: con 'server ... resolve' (descubrimiento DNS de réplicas) NO
# mantiene la afinidad en NGINX 1.30.6. Funciona con servidores estáticos.
hash $http_x_client_id consistent;
