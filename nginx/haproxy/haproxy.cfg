# nginx/haproxy/haproxy.cfg — balanceador alternativo para la comparativa A-05.
# Montado como volumen :ro. La política se toma de la variable HAPROXY_BALANCE
# (roundrobin | leastconn | source), equivalente a round_robin / least_conn / ip_hash.

global
    log stdout format raw local0 info
    maxconn 20000
    stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    retries 3
    option redispatch                 # reintentar en otro servidor (como proxy_next_upstream)
    timeout connect 2s                # = LB_CONNECT_TIMEOUT
    timeout client  10s
    timeout server  10s               # = LB_READ_TIMEOUT
    timeout http-request 10s
    timeout http-keep-alive 60s

# Descubrimiento dinámico de réplicas vía el DNS interno de Docker (equivalente a
# 'resolve' en NGINX): server-template crea 10 slots que se llenan con las IPs
# que devuelve 'backend'.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s
    hold obsolete   5s
    hold nx         5s
    hold other      5s

frontend fe_http
    bind *:80
    http-request set-header X-Request-Id %[uuid()]
    http-response set-header X-LB-Policy "haproxy-${HAPROXY_BALANCE}"
    default_backend be_app

backend be_app
    # HAProxy solo expande variables de entorno entre comillas dobles
    balance "${HAPROXY_BALANCE}"
    # A diferencia de NGINX OSS, HAProxy tiene HEALTH CHECKS ACTIVOS (criterio C3)
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr libc,none
    server-template backend 10 backend:3000 check

# Estadísticas + métricas Prometheus nativas (criterio C4)
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 200 content-type text/plain string "ok\n" if { path /healthz }
