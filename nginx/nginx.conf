# nginx/nginx.conf — se monta como volumen de solo lectura en /etc/nginx/nginx.conf
# (R-15: la imagen oficial NO se modifica; nada se copia dentro de la imagen).
#
# Este archivo es estático. Todo lo parametrizable por .env vive en
# nginx/templates/*.template, que el entrypoint de la imagen oficial procesa con
# envsubst y escribe en /etc/nginx/generated (tmpfs). Aquí solo se incluyen los
# archivos generados.

include /etc/nginx/generated/main.conf;        # worker_processes (desde .env)

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    include /etc/nginx/generated/events.conf;  # worker_connections (desde .env)
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;          # no revelar la versión de NGINX
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/generated/http.conf;    # log JSON, upstream, servidores
}
