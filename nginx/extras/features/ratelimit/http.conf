# nginx/extras/features/ratelimit/http.conf — A-01: limitación de tasa por cliente.
# Clave: X-Client-Id si el cliente la envía; si no, la IP binaria.
map $http_x_client_id $lb_client_key {
    default $http_x_client_id;
    ""      $binary_remote_addr;
}
# 50 peticiones/s por cliente, ráfaga de 100 (nodelay = no encola, rechaza el exceso)
limit_req_zone  $lb_client_key zone=lb_req_per_client:10m  rate=50r/s;
# Máximo 50 conexiones simultáneas por cliente
limit_conn_zone $lb_client_key zone=lb_conn_per_client:10m;
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;
