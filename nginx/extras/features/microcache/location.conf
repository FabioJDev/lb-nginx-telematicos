# nginx/extras/features/microcache/location.conf — A-02 (se incluye dentro de location /)
proxy_cache lb_micro;
proxy_cache_key "$scheme$request_method$host$request_uri";
proxy_cache_bypass $lb_skip_cache;     # no leer de caché lo personalizado
proxy_no_cache     $lb_skip_cache;     # ni guardarlo
proxy_cache_valid 200 1s;              # respuestas 200 válidas 1 s
proxy_cache_lock on;                   # una sola petición llena la caché; el resto espera
proxy_cache_use_stale updating error timeout http_502 http_503 http_504;
proxy_ignore_headers Cache-Control Expires;   # el backend envía no-store; aquí decide NGINX
add_header X-Cache-Status $upstream_cache_status always;
