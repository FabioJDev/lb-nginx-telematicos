# nginx/extras/features/microcache/http.conf — A-02: microcaché de 1 s.
# /var/cache/nginx existe en la imagen oficial y es escribible por el usuario nginx.
proxy_cache_path /var/cache/nginx/micro levels=1:2 keys_zone=lb_micro:10m
                 max_size=50m inactive=10s use_temp_path=off;

# SOLO se cachea el catálogo público (GET /api/products, /api/categories) y el
# endpoint de prueba /api/work. Nunca carrito, sesión, pedidos ni respuestas con
# cookies: la clave de caché no incluye la cookie, así que cachear contenido
# personalizado filtraría el carrito de un usuario a otro.
map "$request_method:$uri" $lb_skip_cache {
    default                                   1;
    "~^GET:/api/(products|categories)(/|$)"   0;
    "~^GET:/api/work$"                        0;
}
