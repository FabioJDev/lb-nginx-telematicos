# nginx/extras/tls/on.conf — A-03: terminación TLS y HTTP/2 en el balanceador.
# El certificado es autofirmado y se genera en un contenedor (scripts/gen-cert.sh);
# compose.tls.yml lo monta en /etc/nginx/certs (solo lectura) y publica el puerto 443.
listen 443 ssl;
http2 on;

ssl_certificate     /etc/nginx/certs/lb.crt;
ssl_certificate_key /etc/nginx/certs/lb.key;
ssl_protocols       TLSv1.2 TLSv1.3;
# Reanudación de sesiones: evita repetir el handshake completo en conexiones nuevas
ssl_session_cache   shared:TLS:10m;
ssl_session_timeout 10m;
