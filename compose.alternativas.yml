# =============================================================================
# compose.alternativas.yml — matriz 4.1: las alternativas de balanceador con su
# configuración MÍNIMA equivalente (alternativas/), sobre las mismas 3 réplicas.
#   C5 (facilidad): líneas de configuración del caso base, comprobado funcionando.
#   C1 (desempeño): misma carga (rampa.yml) contra cada una; p99 y CPU del balanceador.
# Uso: scripts/test-alternativas.sh   (lote "test-alternativas" de pruebas.yml)
# LVS/IPVS no se levanta: necesita el módulo ip_vs del kernel del host (ver alternativas/).
# =============================================================================
x-alt: &alt
  networks: [frontend, backend]
  depends_on:
    backend:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/health || exit 1"]
    interval: 5s
    timeout: 2s
    retries: 10
    start_period: 5s
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

services:
  alt-nginx:
    <<: *alt
    image: ${NGINX_IMAGE:-nginx:1.30-alpine}
    volumes:
      - ./alternativas/nginx.conf:/etc/nginx/nginx.conf:ro

  alt-haproxy:
    <<: *alt
    image: ${HAPROXY_IMAGE:-haproxy:3.2-alpine}
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    volumes:
      - ./alternativas/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  alt-traefik:
    <<: *alt
    image: ${TRAEFIK_IMAGE:-traefik:v3.7.16}
    command: ["traefik", "--configFile=/etc/traefik/traefik.yml"]
    volumes:
      - ./alternativas/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./alternativas/traefik-dinamica.yml:/etc/traefik/traefik-dinamica.yml:ro

  alt-apache:
    <<: *alt
    image: ${HTTPD_IMAGE:-httpd:2.4.68-alpine}
    volumes:
      - ./alternativas/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
