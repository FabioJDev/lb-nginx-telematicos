# alternativas/haproxy.cfg — caso base mínimo (matriz 4.1): round-robin, checks activos,
# reintentos y reutilización de conexiones con los backends (comportamiento por defecto).
global
    maxconn 20000
defaults
    mode http
    timeout connect 2s
    timeout client 10s
    timeout server 10s
    retries 3
    option redispatch
frontend web
    bind :80
    default_backend app
backend app
    balance roundrobin
    option httpchk GET /health
    server b1 lbnginx-backend-1:3000 check inter 2s
    server b2 lbnginx-backend-2:3000 check inter 2s
    server b3 lbnginx-backend-3:3000 check inter 2s
