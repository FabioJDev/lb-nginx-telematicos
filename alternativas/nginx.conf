# alternativas/nginx.conf — caso base mínimo para la matriz 4.1 (C1 desempeño, C5 facilidad):
# proxy en :80 hacia 3 réplicas, round-robin, detección pasiva de fallos y reintentos.
worker_processes auto;
events {}
http {
    access_log off;
    upstream app {
        server lbnginx-backend-1:3000 max_fails=3 fail_timeout=10s;
        server lbnginx-backend-2:3000 max_fails=3 fail_timeout=10s;
        server lbnginx-backend-3:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream error timeout http_502 http_504;
        }
    }
}
