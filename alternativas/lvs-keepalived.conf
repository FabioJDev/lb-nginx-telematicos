# alternativas/lvs-keepalived.conf — caso base de LVS/IPVS (matriz 4.1, C5). LVS no tiene
# detección de fallos propia: se opera con keepalived, que crea el servicio virtual IPVS y
# comprueba cada réplica. NO se ejecuta en este proyecto: IPVS vive en el kernel del host
# (módulo ip_vs) y el modo NAT exige que el director sea la puerta de enlace de los backends,
# algo que la red bridge de Docker no permite. Se cuenta solo para C5.
virtual_server 172.20.0.100 80 {
    delay_loop 2
    lb_algo rr
    lb_kind NAT
    protocol TCP
    real_server 172.20.0.11 3000 {
        HTTP_GET {
            url {
                path /health
                status_code 200
            }
            connect_timeout 2
        }
    }
    real_server 172.20.0.12 3000 {
        HTTP_GET {
            url {
                path /health
                status_code 200
            }
            connect_timeout 2
        }
    }
    real_server 172.20.0.13 3000 {
        HTTP_GET {
            url {
                path /health
                status_code 200
            }
            connect_timeout 2
        }
    }
}
