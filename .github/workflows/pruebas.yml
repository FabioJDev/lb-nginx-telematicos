# .github/workflows/pruebas.yml — Pruebas de carga bajo demanda en GitHub Actions.
#
# Ejecuta un lote (test-min, test-algoritmos, test-escalabilidad, test-quiebre o
# test-ext E=…) en un runner ubuntu-latest, corre el análisis y publica results/ y
# docs/figuras/ como artefacto descargable. Sirve para obtener resultados REALES
# cuando no se dispone de una máquina con Docker; el entorno (2 vCPU, RAM) queda
# registrado en metadata.json de cada corrida y debe reportarse como limitación.
#
#   gh workflow run pruebas.yml -f lote=test-min -f quick=true
#   gh run download <id> -n resultados-<lote>-<id>
name: pruebas

on:
  workflow_dispatch:
    inputs:
      lote:
        description: "Lote a ejecutar"
        type: choice
        required: true
        default: test-min
        options: [test-min, test-algoritmos, test-resiliencia, test-escalabilidad, test-quiebre, test-ext, test-tienda, test-cache, test-haproxy]
      reps:
        description: "Repeticiones por configuración (REPS)"
        type: string
        default: "3"
      quick:
        description: "QUICK=1 (una sola repetición, para validar el lote)"
        type: boolean
        default: false
      extra:
        description: "Para test-ext: E03|E04|E05|E06|E07|E08|E09|E10|E11|E12|E14|E15|all"
        type: string
        default: "E05"
      policy:
        description: "Para test-resiliencia: política"
        type: string
        default: "round_robin"
      work_path:
        description: "Endpoint de carga (WORK_PATH), p. ej. /api/work?ms=20&cpu=3 para saturar CPU"
        type: string
        default: "/api/work?ms=20"
      e03_politicas:
        description: "Para test-ext E03: políticas a medir (vacío = round_robin least_conn random_two + ponderado)"
        type: string
        default: ""
      politicas:
        description: "POLICIES para test-algoritmos / test-tienda (vacío = valores por defecto del script)"
        type: string
        default: ""
      sesiones:
        description: "Para test-tienda: memory, redis o 'memory redis'"
        type: string
        default: "memory redis"
      artillery_cloud:
        description: "Publicar las corridas en Artillery Cloud (requiere el secreto ARTILLERY_CLOUD_API_KEY)"
        type: boolean
        default: true

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      REPS: ${{ inputs.reps }}
      QUICK: ${{ inputs.quick && '1' || '0' }}
      WORK_PATH: ${{ inputs.work_path }}
      E03_POLICIES: ${{ inputs.e03_politicas }}
      E03_WEIGHTED: ${{ inputs.e03_politicas == '' && '1' || '0' }}
      POLICIES: ${{ inputs.politicas }}
      SESSIONS: ${{ inputs.sesiones }}
      # Artillery Cloud: si el secreto no existe, la variable queda vacía y no se publica nada
      ARTILLERY_CLOUD_API_KEY: ${{ secrets.ARTILLERY_CLOUD_API_KEY }}
      ARTILLERY_CLOUD: ${{ inputs.artillery_cloud && 'on' || 'off' }}
    steps:
      - uses: actions/checkout@v4

      - name: Entorno del runner
        run: |
          cp .env.example .env
          echo "cpus=$(nproc) mem=$(awk '/MemTotal/ {printf "%d MB", $2/1024}' /proc/meminfo)"
          docker version --format 'docker {{.Server.Version}}'; docker compose version --short
          if [ -n "$ARTILLERY_CLOUD_API_KEY" ] && [ "$ARTILLERY_CLOUD" = "on" ]; then
            echo "Artillery Cloud: activado (las corridas se publican en app.artillery.io)"
          else
            echo "Artillery Cloud: desactivado (sin secreto ARTILLERY_CLOUD_API_KEY o artillery_cloud=false)"
          fi

      - name: Levantar stack base
        run: |
          docker compose up -d --build
          scripts/wait-healthy.sh backend 3 120
          scripts/wait-healthy.sh lb 1 60
          scripts/smoke.sh 30

      - name: Ejecutar lote ${{ inputs.lote }}
        run: |
          case "${{ inputs.lote }}" in
            test-min)          scripts/test-min.sh ;;
            test-algoritmos)   scripts/test-algoritmos.sh ;;
            test-resiliencia)  scripts/test-resiliencia.sh "${{ inputs.policy }}" ;;
            test-escalabilidad) scripts/test-escalabilidad.sh ;;
            test-quiebre)      scripts/test-quiebre.sh ;;
            test-ext)          scripts/test-extendidas.sh "${{ inputs.extra }}" ;;
            test-tienda)       scripts/test-tienda.sh ;;
            test-cache)        scripts/test-cache.sh ;;
            test-haproxy)      scripts/test-haproxy.sh ;;
          esac

      - name: Análisis y matrices
        if: always()
        run: |
          docker compose --profile tools build analysis
          docker compose --profile tools run --rm analysis || true
          docker compose --profile tools run --rm analysis python decision_matrix.py > /dev/null || true
          docker compose --profile tools run --rm analysis python compare_all.py || true
          sudo chown -R "$(id -u):$(id -g)" results docs || true
          ls -la results | head -40
          cat results/significancia.txt 2>/dev/null || true

      - name: Enlaces a Artillery Cloud
        if: always()
        run: |
          {
            echo "### Corridas del lote ${{ inputs.lote }}"
            echo
            echo "| Corrida | Artillery Cloud |"
            echo "|---|---|"
            for m in results/2026*/metadata.json; do
              [ -f "$m" ] || continue
              run=$(basename "$(dirname "$m")")
              url=$(grep -o '"artillery_cloud_url": *"[^"]*"' "$m" | sed 's/.*: *"//; s/"$//')
              echo "| \`$run\` | ${url:-—} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comprimir logs grandes de NGINX
        if: always()
        run: find results -name 'nginx_access.jsonl' -size +2M -exec gzip -9 {} \; ; du -sh results

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ inputs.lote }}-${{ github.run_id }}
          path: |
            results/
            docs/figuras/
            docs/decision-matrix-generada.md
            docs/comparacion-algoritmos.md
          if-no-files-found: warn
          retention-days: 90

      - name: Bajar stack
        if: always()
        run: docker compose --profile tools --profile loadtest down -v --remove-orphans
