# .github/workflows/ci.yml — A-06: integración continua.
# En cada push/PR: valida compose, construye el backend, levanta el stack, corre
# nginx -t, el smoke test (30 peticiones, 3 nodos) y el escenario smoke de Artillery,
# y publica la corrida como artefacto. Todo en contenedores (como en el proyecto).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Finales de línea LF en scripts y configuración
        run: make check-eol

      - name: Crear .env
        run: cp .env.example .env

      - name: Validar docker-compose (base, override, weighted, haproxy)
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f compose.weighted.yml config -q
          docker compose -f docker-compose.yml -f compose.haproxy.yml config -q

      - name: shellcheck
        run: make shellcheck

      - name: Configuración de HAProxy válida (A-05)
        run: |
          docker run --rm -e HAPROXY_BALANCE=roundrobin \
            -v "$PWD/nginx/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
            haproxy:3.2-alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

      - name: Construir backend
        run: docker compose build backend

      - name: Levantar stack base
        run: |
          docker compose up -d
          scripts/wait-healthy.sh postgres 1 120
          scripts/wait-healthy.sh redis 1 60
          scripts/wait-healthy.sh backend 3 120
          scripts/wait-healthy.sh lb 1 60
          docker compose ps

      - name: nginx -t y configuración generada
        run: |
          docker compose exec -T lb nginx -t
          docker compose exec -T lb cat /etc/nginx/generated/http.conf

      - name: Backends sin puertos publicados (R-16)
        run: |
          if docker compose ps backend --format '{{.Ports}}' | grep -E '0\.0\.0\.0|:::' ; then
            echo "ERROR: un backend publica puertos al host"; exit 1; fi
          echo "OK: backends solo con expose"

      - name: Smoke test (30 peticiones, >= 3 nodos)
        run: scripts/smoke.sh 30

      - name: Cambio de política y escalado en caliente
        run: |
          scripts/set-policy.sh least_conn
          scripts/scale.sh 5
          scripts/smoke.sh 30
          scripts/scale.sh 3
          scripts/set-policy.sh round_robin

      - name: Afinidad de sesión por política (hash + resolve)
        run: |
          for pol in round_robin least_conn random_two ip_hash hash_client hash_client_consistent hash_remote_addr; do
            scripts/set-policy.sh "$pol" >/dev/null
            scripts/check-affinity.sh 30 5 || true
          done
          scripts/set-policy.sh round_robin >/dev/null

      - name: Remapeo de clientes al retirar un backend (E-06)
        run: |
          for pol in hash_client hash_client_consistent round_robin; do
            scripts/set-policy.sh "$pol" >/dev/null
            scripts/check-remap.sh 5 200 || true
          done
          scripts/set-policy.sh round_robin >/dev/null

      - name: Tienda (PostgreSQL + Redis) a través del balanceador
        run: |
          docker compose exec -T lb wget -qO- http://127.0.0.1/ready; echo
          docker compose exec -T lb wget -qO- "http://127.0.0.1/api/products?size=2"; echo
          docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from products"'
          scripts/run-test.sh CI-TIENDA tienda-smoke.yml redis
          f=$(ls -d results/*_CI-TIENDA_*_redis)/artillery.json
          grep -oE '"tienda\.[a-z_.]+": *[0-9]+' "$f"
          grep -qE '"tienda\.pedido_ok": *5' "$f" || { echo "ERROR: se esperaban 5 pedidos completados"; exit 1; }

      - name: Sesiones en memoria sin y con afinidad (E-16 en miniatura)
        run: |
          scripts/set-env.sh SESSION_STORE memory --recreate-backend
          scripts/set-policy.sh round_robin
          scripts/run-test.sh CI-SES tienda-smoke.yml memoria-rr
          scripts/set-policy.sh sticky_cookie
          scripts/run-test.sh CI-SES tienda-smoke.yml memoria-sticky
          echo "--- round_robin + memoria (se espera pérdida de sesión):"
          grep -oE '"tienda\.[a-z_.]+": *[0-9]+' results/*_CI-SES_*_memoria-rr/artillery.json || true
          echo "--- sticky_cookie + memoria (se esperan 5 pedidos):"
          grep -oE '"tienda\.[a-z_.]+": *[0-9]+' results/*_CI-SES_*_memoria-sticky/artillery.json || true
          grep -qE '"tienda\.pedido_ok": *5' results/*_CI-SES_*_memoria-sticky/artillery.json
          scripts/set-env.sh SESSION_STORE redis --recreate-backend
          scripts/set-policy.sh round_robin

      - name: Escenario smoke de Artillery con el ejecutor completo
        run: scripts/run-test.sh CI smoke.yml

      - name: Análisis
        run: |
          docker compose --profile tools build analysis
          docker compose --profile tools run --rm analysis
          docker compose --profile tools run --rm analysis python decision_matrix.py > /dev/null
          docker compose --profile tools run --rm analysis python compare_all.py

      - name: Diagnóstico (estado, healthchecks y logs)
        if: always()
        run: |
          docker compose ps -a || true
          for id in $(docker compose ps -aq); do
            echo "== $(docker inspect -f '{{.Name}} health={{if .State.Health}}{{.State.Health.Status}}{{end}} exit={{.State.ExitCode}}' "$id")"
            docker inspect -f '{{range .State.Health.Log}}{{.ExitCode}} {{.Output}}{{end}}' "$id" 2>/dev/null | tail -3 || true
          done
          docker compose logs --no-color backend | tail -40 || true
          docker compose logs --no-color lb | tail -50 || true

      - name: Publicar corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ci
          path: |
            results/
            docs/figuras/
          if-no-files-found: ignore

      - name: Bajar stack
        if: always()
        run: docker compose --profile tools --profile loadtest down -v --remove-orphans
